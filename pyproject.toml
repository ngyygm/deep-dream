[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "deep-dream"
version = "0.2.0"
description = "Deep-Dream Document-first concept memory graph server"
requires-python = ">=3.10"
license = {text = "MIT"}
readme = "README.md"

dependencies = [
    # Core
    "openai>=1.0.0",
    "flask>=3.0",
    "PyJWT>=2.0",
    "httpx>=0.24",
    "numpy>=1.21.0",
    # Embedding / ML（sentence-transformers 自带 torch/transformers 依赖）
    "sentence-transformers>=2.2.0",
    # CLI
    "click>=8.1",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-cov", "ruff"]

[project.scripts]
deep-dream = "core.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["core*"]

[tool.setuptools.package-data]
"core.agent" = ["policies/*.md"]

[tool.pytest.ini_options]
testpaths = ["core/tests"]
markers = [
    "real_llm: test requires USE_REAL_LLM=1",
    "slow: test takes > 5 seconds",
    "e2e: test requires a running Deep-Dream server",
]

[tool.ruff.lint.per-file-ignores]
# 这两个文件在 import 前做 sys.path 引导（支持脚本直跑），core.* 必须在其后
"core/server/api.py" = ["E402"]
"core/tests/conftest.py" = ["E402"]
