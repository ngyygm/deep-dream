<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="820" viewBox="0 0 1600 820" role="img" aria-labelledby="title desc">
<title id="title">A document-first temporal concept graph</title><desc id="desc">Figure 5. Illustrative document/Episode/entity-family graph and selected-concept history. Three documents share the Trip concept through provenance links. A Paris plan is updated to Rome and later confirmed. Each observation remains linked to its own original source; processing time is the sole state axis. Relations connect concepts, and uncertain families may be redirected after additional evidence. This is not a measured benchmark case.</desc>
