<title id="title">Memory addressing and adaptive evidence reading</title><desc id="desc">Figure 1. Fixed top-k retrieval and query-time progressive disclosure. The graph addresses source spans; the agent can return to search after a read. The provenance gate checks read identifiers, not answer correctness.</desc>
